# Create kubepanel-auth separately; replace the placeholder with your initial password.
# kubectl -n kube-system create secret generic kubepanel-auth --from-literal=DASHBOARD_PASSWORD='REPLACE_WITH_A_STRONG_PASSWORD'
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubepanel-data
  namespace: kube-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubepanel-clusters
  namespace: kube-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepanel
  namespace: kube-system
  labels:
    app: kubepanel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubepanel
  template:
    metadata:
      labels:
        app: kubepanel
    spec:
      serviceAccountName: kubepanel
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubepanel
          # Replace with the same immutable revision tag/digest built by release.sh.
          image: kubepanel:REPLACE_WITH_FULL_GIT_REVISION
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: kubepanel-auth
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '8080'
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: clusters
              mountPath: /app/kube/clusters
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubepanel-data
        - name: clusters
          persistentVolumeClaim:
            claimName: kubepanel-clusters
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubepanel
  namespace: kube-system
spec:
  type: NodePort
  selector:
    app: kubepanel
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30090
      protocol: TCP
