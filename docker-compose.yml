services:
  kubepanel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_REVISION: ${BUILD_REVISION:-development}
        SOURCE_MANIFEST_SHA256: ${SOURCE_MANIFEST_SHA256:-development}
    image: kubepanel:${BUILD_REVISION:-development}
    container_name: kubepanel
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-9090}:8080"
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_SECRET: ${DASHBOARD_SECRET:-}
      DASHBOARD_TOKEN_TTL: ${DASHBOARD_TOKEN_TTL:-12h}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - ${BASE_DIR:-/opt/kubepanel}/clusters:/app/kube/clusters
      - ${BASE_DIR:-/opt/kubepanel}/data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
